# Coolify-optimized Sentry Self-Hosted Docker Compose
# This version eliminates the need for install.sh and is ready for direct deployment

# DO NOT expose ports in Coolify - they are handled automatically
x-restart-policy: &restart_policy
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 90s
  retries: 15
  start_period: 60s

x-file-healthcheck: &file_healthcheck_defaults
  test: ["CMD-SHELL", "rm /tmp/health.txt"]
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 600s

x-sentry-defaults: &sentry_defaults
  <<: *restart_policy
  image: ghcr.io/getsentry/sentry:25.8.0
  depends_on:
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
    memcached:
      condition: service_started
    smtp:
      condition: service_started
    snuba-api:
      condition: service_started
    symbolicator:
      condition: service_started
  environment:
    PYTHONUSERBASE: "/data/custom-packages"
    SENTRY_CONF: "/etc/sentry"
    SNUBA: "http://snuba-api:1218"
    VROOM: "http://vroom:8085"
    DEFAULT_CA_BUNDLE: &ca_bundle "/etc/ssl/certs/ca-certificates.crt"
    REQUESTS_CA_BUNDLE: *ca_bundle
    GRPC_DEFAULT_SSL_ROOTS_FILE_PATH_ENV_VAR: *ca_bundle
    COMPOSE_PROFILES: "feature-complete"
    SENTRY_EVENT_RETENTION_DAYS: "90"
    SENTRY_MAIL_HOST: "smtp"
    # Generate secret key on first boot
    SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-}"
  volumes:
    - "sentry-data:/data"
    - "./config/sentry:/etc/sentry"
    - "./config/geoip:/geoip:ro"
    - "./config/certificates:/usr/local/share/ca-certificates:ro"

x-snuba-defaults: &snuba_defaults
  <<: *restart_policy
  depends_on:
    clickhouse:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  image: ghcr.io/getsentry/snuba:25.8.0
  environment:
    SNUBA_SETTINGS: self_hosted
    CLICKHOUSE_HOST: clickhouse
    DEFAULT_BROKERS: "kafka:9092"
    REDIS_HOST: redis
    UWSGI_MAX_REQUESTS: "10000"
    UWSGI_DISABLE_LOGGING: "true"
    SENTRY_EVENT_RETENTION_DAYS: "90"

services:
  # Infrastructure Services
  smtp:
    <<: *restart_policy
    image: registry.gitlab.com/egos-tech/smtp
    volumes:
      - "sentry-smtp:/var/spool/exim4"
      - "sentry-smtp-log:/var/log/exim4"
    environment:
      - MAILNAME=${SENTRY_MAIL_HOST:-localhost}

  memcached:
    <<: *restart_policy
    image: "memcached:1.6.26-alpine"
    command: ["-I", "1M"]
    healthcheck:
      <<: *healthcheck_defaults
      test: echo stats | nc 127.0.0.1 11211

  redis:
    <<: *restart_policy
    image: "redis:6.2.14-alpine"
    healthcheck:
      <<: *healthcheck_defaults
      test: redis-cli ping | grep PONG
    volumes:
      - "sentry-redis:/data"
      - "./config/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  postgres:
    <<: *restart_policy
    image: "postgres:14.11"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
    volumes:
      - "sentry-postgres:/var/lib/postgresql/data"

  kafka:
    <<: *restart_policy
    image: "confluentinc/cp-kafka:7.6.1"
    environment:
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_BROKER_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_MESSAGE_MAX_BYTES: "50000000"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "50000000"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "nc -z localhost 9092"]
    volumes:
      - "sentry-kafka:/var/lib/kafka/data"

  zookeeper:
    <<: *restart_policy
    image: "confluentinc/cp-zookeeper:7.6.1"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "nc -z localhost 2181"]
    volumes:
      - "sentry-zookeeper:/var/lib/zookeeper/data"
      - "sentry-zookeeper-log:/var/lib/zookeeper/log"

  clickhouse:
    <<: *restart_policy
    image: "clickhouse/clickhouse-server:23.8-alpine"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
    volumes:
      - "sentry-clickhouse:/var/lib/clickhouse"
      - "./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/sentry.xml:ro"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Sentry Core Services

  web:
    <<: *sentry_defaults
    command:
      - "bash"
      - "-c"
      - |
        # Ensure config files exist
        if [ ! -f /etc/sentry/config.yml ] && [ -f /etc/sentry/config.example.yml ]; then
          cp /etc/sentry/config.example.yml /etc/sentry/config.yml
        fi
        if [ ! -f /etc/sentry/sentry.conf.py ] && [ -f /etc/sentry/sentry.conf.example.py ]; then
          cp /etc/sentry/sentry.conf.example.py /etc/sentry/sentry.conf.py
        fi
        # Generate secret key if needed
        if grep -q 'system.secret-key.*!!changeme!!' /etc/sentry/config.yml 2>/dev/null; then
          NEW_SECRET_KEY=$$(head /dev/urandom | tr -dc 'a-z0-9@#%^&*(-_=+)' | head -c 50)
          sed -i "s/system.secret-key:.*/system.secret-key: '$NEW_SECRET_KEY'/" /etc/sentry/config.yml
        fi
        # Initialize and start
        sentry upgrade --noinput
        sentry exec -c 'from sentry.models import User; User.objects.filter(is_superuser=True).exists() or User.objects.create_superuser(email="admin@localhost", password="admin", username="admin")'
        exec sentry run web
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "curl -f http://localhost:9000/_health/ || exit 1"]
    labels:
      # Coolify will handle routing, but we specify the internal port
      - "coolify.main=true"
      - "coolify.port=9000"

  cron:
    <<: *sentry_defaults
    command:
      - "bash"
      - "-c"
      - "sleep 30; exec sentry run cron"
    healthcheck:
      <<: *file_healthcheck_defaults

  worker:
    <<: *sentry_defaults
    command:
      - "bash"
      - "-c"
      - "sleep 30; exec sentry run worker"
    healthcheck:
      <<: *file_healthcheck_defaults

  # Snuba Services
  snuba-api:
    <<: *snuba_defaults
    command:
      - "bash"
      - "-c"
      - "snuba bootstrap --no-migrate-kafka || true; exec snuba api"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "curl -f http://localhost:1218/health || exit 1"]

  snuba-consumer:
    <<: *snuba_defaults
    command: ["consumer", "--storage", "events", "--auto-offset-reset=latest", "--max-batch-time-ms", "750"]
    healthcheck:
      <<: *file_healthcheck_defaults

  snuba-errors-consumer:
    <<: *snuba_defaults
    command: ["consumer", "--storage", "errors", "--auto-offset-reset=latest", "--max-batch-time-ms", "750"]
    healthcheck:
      <<: *file_healthcheck_defaults

  snuba-transactions-consumer:
    <<: *snuba_defaults
    command: ["consumer", "--storage", "transactions", "--auto-offset-reset=latest", "--max-batch-time-ms", "750"]
    healthcheck:
      <<: *file_healthcheck_defaults

  snuba-subscription-consumer-events:
    <<: *snuba_defaults
    command: ["subscriptions-scheduler-executor", "--dataset", "events", "--entity", "events", "--auto-offset-reset=latest", "--no-strict-offset-reset", "--consumer-group", "snuba-events-subscriptions-consumers", "--followed-consumer-group", "snuba-consumers", "--delay-seconds", "60", "--schedule-ttl", "60", "--stale-threshold-seconds", "900"]
    healthcheck:
      <<: *file_healthcheck_defaults

  snuba-subscription-consumer-transactions:
    <<: *snuba_defaults
    command: ["subscriptions-scheduler-executor", "--dataset", "transactions", "--entity", "transactions", "--auto-offset-reset=latest", "--no-strict-offset-reset", "--consumer-group", "snuba-transactions-subscriptions-consumers", "--followed-consumer-group", "transactions_consumer", "--delay-seconds", "60", "--schedule-ttl", "60", "--stale-threshold-seconds", "900"]
    healthcheck:
      <<: *file_healthcheck_defaults

  # Additional Services
  symbolicator:
    <<: *restart_policy
    image: ghcr.io/getsentry/symbolicator:25.8.0
    volumes:
      - "sentry-symbolicator:/data"
      - "./config/symbolicator:/etc/symbolicator:ro"
    command: ["run", "-c", "/etc/symbolicator/config.yml"]
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "curl -f http://localhost:3021/health || exit 1"]

  relay:
    <<: *restart_policy
    image: ghcr.io/getsentry/relay:25.8.0
    volumes:
      - "./config/relay:/work/.relay:ro"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/relay/healthcheck/ready/ || exit 1"]

  vroom:
    <<: *restart_policy
    image: ghcr.io/getsentry/vroom:25.8.0
    environment:
      SENTRY_SNUBA_HOST: "http://snuba-api:1218"
    depends_on:
      snuba-api:
        condition: service_started
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]

volumes:
  sentry-clickhouse:
  sentry-data:
  sentry-kafka:
  sentry-postgres:
  sentry-redis:
  sentry-symbolicator:
  sentry-smtp:
  sentry-smtp-log:
  sentry-zookeeper:
  sentry-zookeeper-log:

# Networks are handled automatically by Coolify